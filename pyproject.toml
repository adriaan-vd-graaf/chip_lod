[project]
name = "chip-lod"
version = "0.1.0"
description = "Limit of detection for a specific somatic (CHIP) variant: Poisson model with error background and Bayesian posterior"
requires-python = ">=3.13"
dependencies = ["matplotlib"]

[dependency-groups]
dev = ["pytest", "scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/src/chip_lod"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
